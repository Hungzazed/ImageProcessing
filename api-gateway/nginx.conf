events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Định dạng log chi tiết bao gồm IP client, thông tin request, và thời gian phản hồi upstream
    log_format main_custom '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          'rt=$request_time uct="$upstream_connect_time" uert="$upstream_header_time" urt="$upstream_response_time"';

    # Các cấu hình tối ưu hiệu năng cơ bản
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # =========================================================================
    # 🛡️ RESILIENCE: RATE-LIMITER (Chống Spam API / DDoS)
    # =========================================================================
    # Giới hạn mỗi Client IP chỉ được phép gửi tối đa 10 requests / giây
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=10r/s;
    # Trả về mã lỗi 429 thay vì 503 khi vượt quá tần suất cho phép
    limit_req_status 429;

    # =========================================================================
    # 🛡️ RESILIENCE: BULKHEAD (Cách ly tài nguyên)
    # =========================================================================
    # Giới hạn số lượng kết nối đồng thời từ một Client IP là 10 (chống cạn kiệt connection pool)
    limit_conn_zone $binary_remote_addr zone=ip_bulkhead:10m;
    # Giới hạn tổng số lượng kết nối đồng thời trên toàn bộ API Gateway là 200
    limit_conn_zone $server_name zone=server_bulkhead:10m;
    # Trả về mã lỗi 429 khi vượt quá số lượng kết nối đồng thời
    limit_conn_status 429;

    # =========================================================================
    # 🛡️ UPSTREAMS & CIRCUIT BREAKER (max_fails / fail_timeout)
    # =========================================================================
    
    # 1. Backend Auth Service (Chạy trên server 13.236.6.40)
    upstream auth_service_backend {
        server 13.236.6.40:80 max_fails=3 fail_timeout=15s; # Circuit Breaker: sập 3 lần ngắt 15 giây
        keepalive 32; # Giữ kết nối lâu dài (HTTP Keep-Alive)
    }

    # 2. Backend User Service (Chạy trên server 13.239.122.251:3001)
    upstream user_service_backend {
        server 13.239.122.251:3001 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    # 3. AWS Lambda Serverless Image Processing Pipeline
    upstream image_pipeline_backend {
        # Địa chỉ AWS API Gateway đích chạy HTTPS (Cổng 443)
        server 3m34ux39q0.execute-api.us-east-1.amazonaws.com:443 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Áp dụng Bulkhead (Giới hạn kết nối đồng thời) cho toàn bộ Gateway
        limit_conn ip_bulkhead 10;
        limit_conn server_bulkhead 200;

        # Áp dụng Rate Limiter cho toàn bộ Gateway (cho phép burst tối đa 20 requests)
        limit_req zone=api_rate_limit burst=20 nodelay;

        # =========================================================================
        # 🔑 AUTH REQUEST: ĐIỂM XÁC THỰC TOKEN NỘI BỘ (Internal Subrequest)
        # =========================================================================
        location = /internal-auth-verify {
            internal; # Chỉ cho phép gọi nội bộ từ bên trong Nginx, cấm truy cập từ ngoài
            proxy_pass http://auth_service_backend/auth/verify;
            proxy_pass_request_body off; # Bỏ qua request body để tối ưu hóa hiệu năng truyền tải
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;

            # Chuyển tiếp Token trong Authorization header và cookie của client tới auth service
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;

            # Sử dụng HTTP 1.1 để giữ kết nối lâu dài tới upstream
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # =========================================================================
        # 🔓 1. PUBLIC AUTH ROUTES: Không cần xác thực Token ở Gateway
        # =========================================================================
        location /api/v1/auth/ {
            # Rewrite URL từ /api/v1/auth/xyz thành /auth/xyz để khớp với route của backend
            rewrite ^/api/v1/auth/(.*)$ /auth/$1 break;
            
            proxy_pass http://auth_service_backend;

            # 🔄 RESILIENCE: Cấu hình cơ chế Retry
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;
            proxy_intercept_errors on; # Cho phép Nginx chặn mã lỗi để xử lý qua fallback

            # Thiết lập header chuyển tiếp thông tin client
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Tối ưu kết nối bằng HTTP 1.1 và keepalive
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # =========================================================================
        # 🔒 2. PROTECTED USER ROUTES: Bắt buộc xác thực Token
        # =========================================================================
        location /api/v1/users/ {
            # Ủy quyền xác thực qua subrequest /internal-auth-verify
            auth_request /internal-auth-verify;

            # Trích xuất thông tin User ID từ header trả về của Auth Service (nếu có)
            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $user_id;

            # Rewrite đường dẫn /api/v1/users/xyz thành /users/xyz để gửi tới backend
            rewrite ^/api/v1/users/(.*)$ /users/$1 break;

            proxy_pass http://user_service_backend;

            # 🔄 RESILIENCE: Retry
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;
            proxy_intercept_errors on;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Redirect để xử lý trường hợp không có slash ở cuối /api/v1/users
        location = /api/v1/users {
            return 301 /api/v1/users/;
        }

        # =========================================================================
        # 🔒 3. PROTECTED IMAGE PIPELINE: Bắt buộc xác thực Token
        # =========================================================================
        location /api/v1/process {
            # Ủy quyền xác thực qua subrequest /internal-auth-verify
            auth_request /internal-auth-verify;

            # Trích xuất thông tin User ID
            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $user_id;

            # Proxy tới API Gateway của AWS Lambda (lược bỏ /api/v1/process thành /prod/process)
            proxy_pass https://image_pipeline_backend/prod/process;

            # 🔄 RESILIENCE: Retry cho Image Processing (timeout dài hơn do xử lý nặng)
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 8s;
            proxy_intercept_errors on;

            # ⚠️ QUAN TRỌNG: Ghi đè Host header bằng đúng tên miền của AWS để khớp với chứng chỉ SSL/TLS
            proxy_set_header Host 3m34ux39q0.execute-api.us-east-1.amazonaws.com;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # =========================================================================
        # 🏥 HEALTH CHECK
        # =========================================================================
        location /health {
            return 200 '{"status":"UP","gateway":"Nginx API Gateway"}';
            add_header Content-Type application/json;
        }

        # =========================================================================
        # 🌀 FALLBACK: CUSTOM JSON ERROR RESPONSE FOR CIRCUIT BREAKER & SERVER ERRORS
        # =========================================================================
        error_page 502 503 504 = @fallback;
        location @fallback {
            return 503 '{"status":"error","code":503,"message":"Service temporarily unavailable. Circuit breaker triggered or backend offline."}';
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
        }
    }
}