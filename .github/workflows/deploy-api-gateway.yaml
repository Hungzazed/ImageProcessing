name: Deploy API Gateway to EC2

on:
  push:
    branches:
      - main
    paths:
      - "api-gateway/**"
      - ".github/workflows/deploy-api-gateway.yaml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # SSH deploy EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_API_GATEWAY_HOST }}
          username: ${{ secrets.EC2_API_GATEWAY_USERNAME }}
          key: ${{ secrets.EC2_API_GATEWAY_SSH_KEY }}
          port: 22

          script: |
            cd ~/ImageProcessing

            echo "Pull latest source..."
            git pull origin main

            cd api-gateway

            echo "Build Docker image..."
            docker build -f DockerFile -t api-gateway ./api-gateway

            echo "Stop old container..."
            docker stop api-gateway || true
            docker rm api-gateway || true

            echo "Run new container..."
            docker run -d \
              --name api-gateway \
              -p 80:80 \
              -v ~/ImageProcessing/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro \
              api-gateway

            echo "Clean unused images..."
            docker image prune -f

            echo "Deployment completed!"